<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortyURL - Мої посилання</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Inter", sans-serif !important;
      }
      .navbar-brand {
        font-weight: 700;
      }
      .table-responsive {
        overflow-x: auto;
      }
      @media (max-width: 576px) {
        .btn-lg {
          padding: 0.5rem 1rem;
          font-size: 1rem;
        }
        h1 {
          font-size: 2rem;
        }
      }
    </style>
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="about.html">
          <img
            src="./logo.png"
            alt="ShortyURL"
            width="30"
            height="30"
            class="rounded-circle object-fit-cover"
          />
          ShortyURL
        </a>
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link active" href="index.html">Головна</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="profile.html">Профіль</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">Про сервіс</a>
            </li>
            <li
              class="nav-item ms-lg-3 mt-2 mt-lg-0"
              id="authBtnContainer"
            ></li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5">
      <div class="text-center mb-5">
        <h1 class="display-5 fw-bold">Скоротити посилання</h1>
        <p class="text-muted">
          Вставте довгий URL та отримайте зручне посилання миттєво
        </p>
      </div>

      <div class="card p-4 shadow-sm border-0 mb-5">
        <form class="row g-3" id="shortenForm">
          <div class="col-md-9">
            <input
              type="url"
              id="longUrlInput"
              class="form-control form-control-lg"
              placeholder="https://example.com"
              required
            />
          </div>
          <div class="col-md-3">
            <button
              type="submit"
              class="btn btn-primary btn-lg w-100 shadow-sm"
            >
              Скоротити
            </button>
          </div>
        </form>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="mb-0 fw-bold">Ваші посилання</h3>
        <span class="badge bg-secondary px-3 py-2 rounded-pill" id="totalCount"
          >Всього: 0</span
        >
      </div>

      <div class="table-responsive card shadow-sm border-0">
        <table class="table table-hover mb-0 align-middle">
          <thead class="table-light">
            <tr>
              <th>Оригінальний URL</th>
              <th>Скорочений URL</th>
              <th class="text-end">Дії</th>
            </tr>
          </thead>
          <tbody id="urlTableBody"></tbody>
        </table>
      </div>

      <nav class="mt-4 d-flex justify-content-center">
        <ul class="pagination shadow-sm" id="pagination"></ul>
      </nav>
    </main>

    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Редагувати посилання</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="editId" />
            <div class="mb-3">
              <label class="form-label">Оригінальний URL</label>
              <input
                type="url"
                id="editUrlInput"
                class="form-control"
                required
              />
            </div>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Скасувати
            </button>
            <button type="button" class="btn btn-primary" id="saveEditBtn">
              Зберегти зміни
            </button>
          </div>
        </div>
      </div>
    </div>

    <footer
      class="bg-dark text-white text-center py-4 mt-auto border-top border-secondary"
    >
      <div class="container">
        <p class="mb-0 small fw-light">
          &copy; 2026 ShortyURL Inc. Усі права захищено.
        </p>
      </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
      class UrlModel {
        constructor() {
          this.currentUser = JSON.parse(localStorage.getItem("currentUser"));
          this.storageKey = this.currentUser
            ? `links_${this.currentUser.email}`
            : "links_guest";
          this.itemsPerPage = 5;
        }

        getLinks() {
          const links = localStorage.getItem(this.storageKey);
          return links ? JSON.parse(links) : [];
        }

        canAddMore() {
          if (this.currentUser) return true;
          return this.getLinks().length < 3; 
        }

        addLink(longUrl) {
          if (!this.canAddMore()) return false;

          const links = this.getLinks();
          const newLink = {
            id: Date.now(),
            long: longUrl,
            short: `https://shorty.url/${Math.random().toString(36).substring(2, 8)}`,
          };
          links.unshift(newLink);
          localStorage.setItem(this.storageKey, JSON.stringify(links));
          return true;
        }

        updateLink(id, newLongUrl) {
          const links = this.getLinks();
          const index = links.findIndex((l) => l.id === id);
          if (index !== -1) {
            links[index].long = newLongUrl;
            localStorage.setItem(this.storageKey, JSON.stringify(links));
          }
        }

        deleteLink(id) {
          const links = this.getLinks().filter((link) => link.id !== id);
          localStorage.setItem(this.storageKey, JSON.stringify(links));
        }

        getPaginatedLinks(page) {
          const all = this.getLinks();
          const start = (page - 1) * this.itemsPerPage;
          return {
            data: all.slice(start, start + this.itemsPerPage),
            totalPages: Math.ceil(all.length / this.itemsPerPage),
            totalCount: all.length,
          };
        }
      }

      class UrlView {
        constructor() {
          this.form = document.getElementById("shortenForm");
          this.input = document.getElementById("longUrlInput");
          this.submitBtn = this.form.querySelector('button[type="submit"]');
          this.tableBody = document.getElementById("urlTableBody");
          this.totalCount = document.getElementById("totalCount");
          this.authContainer = document.getElementById("authBtnContainer");
          this.pagination = document.getElementById("pagination");
          this.editModal = new bootstrap.Modal(
            document.getElementById("editModal"),
          );
        }

        renderAuth(isLoggedIn, logoutHandler) {
          this.authContainer.innerHTML = isLoggedIn
            ? `<a class="btn btn-outline-light btn-sm px-3" href="#" id="logoutBtn">Вихід</a>`
            : `<a class="btn btn-outline-light btn-sm px-3" href="login.html">Увійти</a>`;

          const btn = document.getElementById("logoutBtn");
          if (btn) btn.onclick = logoutHandler;
        }

        updateFormStatus(canAdd, isLoggedIn) {
          if (canAdd) {
            this.submitBtn.disabled = false;
            this.submitBtn.textContent = "Скоротити";
            this.input.disabled = false;
            this.input.placeholder = "https://example.com";
          } else {
            this.submitBtn.disabled = true;
            this.submitBtn.textContent = "Ліміт вичерпано";
            this.input.disabled = true;
            this.input.placeholder = isLoggedIn
              ? "Ви досягли ліміту"
              : "Авторизуйтесь, щоб скорочувати більше";
          }
        }

        renderTable(pageData, currentPage) {
          this.tableBody.innerHTML = "";
          this.totalCount.textContent = `Всього: ${pageData.totalCount}`;

          pageData.data.forEach((link) => {
            const row = `
              <tr>
                <td class="text-truncate" style="max-width: 250px">
                  <a href="${link.long}" target="_blank" class="text-decoration-none text-muted" title="${link.long}">${link.long}</a>
                </td>
                <td>
                  <a href="${link.long}" target="_blank" class="text-decoration-none fw-bold text-primary">${link.short}</a>
                </td>
                <td class="text-end">
                  <div class="btn-group">
                    <button class="btn btn-sm btn-outline-warning border-0 edit-trigger" data-id="${link.id}" data-url="${link.long}">
                      <i class="bi bi-pencil"></i>
                    </button>
                    <button class="btn btn-sm btn-outline-danger border-0 delete-btn" data-id="${link.id}">
                      <i class="bi bi-trash"></i>
                    </button>
                  </div>
                </td>
              </tr>
            `;
            this.tableBody.insertAdjacentHTML("beforeend", row);
          });

          this.renderPagination(pageData.totalPages, currentPage);
        }

        renderPagination(totalPages, current) {
          this.pagination.innerHTML = "";
          if (totalPages <= 1) return;

          for (let i = 1; i <= totalPages; i++) {
            this.pagination.insertAdjacentHTML(
              "beforeend",
              `
              <li class="page-item ${i === current ? "active" : ""}">
                <button class="page-link" data-page="${i}">${i}</button>
              </li>
            `,
            );
          }
        }

        openEditModal(id, url) {
          document.getElementById("editId").value = id;
          document.getElementById("editUrlInput").value = url;
          this.editModal.show();
        }
      }

      class UrlController {
        constructor(model, view) {
          this.model = model;
          this.view = view;
          this.currentPage = 1;

          this.init();
        }

        init() {
          this.view.renderAuth(!!this.model.currentUser, () => {
            localStorage.removeItem("currentUser");
            window.location.reload();
          });

          this.refresh();

          this.view.form.onsubmit = (e) => {
            e.preventDefault();
            const success = this.model.addLink(this.view.input.value);
            if (success) {
              this.view.input.value = "";
              this.currentPage = 1;
              this.refresh();
            }
          };

          this.view.tableBody.onclick = (e) => {
            const id = Number(e.target.closest("button")?.dataset.id);
            if (e.target.closest(".delete-btn")) {
              if (confirm("Видалити посилання?")) {
                this.model.deleteLink(id);
                this.refresh();
              }
            }
            if (e.target.closest(".edit-trigger")) {
              const url = e.target.closest(".edit-trigger").dataset.url;
              this.view.openEditModal(id, url);
            }
          };

          this.view.pagination.onclick = (e) => {
            if (e.target.dataset.page) {
              this.currentPage = Number(e.target.dataset.page);
              this.refresh();
            }
          };

          document.getElementById("saveEditBtn").onclick = () => {
            const id = Number(document.getElementById("editId").value);
            const newUrl = document.getElementById("editUrlInput").value;
            this.model.updateLink(id, newUrl);
            this.view.editModal.hide();
            this.refresh();
          };
        }

        refresh() {
          const data = this.model.getPaginatedLinks(this.currentPage);

          const canAdd = this.model.canAddMore();
          this.view.updateFormStatus(canAdd, !!this.model.currentUser);

          if (data.data.length === 0 && this.currentPage > 1) {
            this.currentPage--;
            this.refresh();
            return;
          }
          this.view.renderTable(data, this.currentPage);
        }
      }

      new UrlController(new UrlModel(), new UrlView());
    </script>
  </body>
</html>
