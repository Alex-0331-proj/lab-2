<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ShortyURL - Мій профіль</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body class="d-flex flex-column min-vh-100 bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="about.html">
          <img
            src="./logo.png"
            alt="ShortyURL"
            width="30"
            height="30"
            class="rounded-circle object-fit-cover"
          />
          ShortyURL</a
        >
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarNav"
        >
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Головна</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="profile.html">Профіль</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="about.html">Про сервіс</a>
            </li>
            <li class="nav-item ms-lg-3 mt-2 mt-lg-0">
              <a class="btn btn-outline-light btn-sm px-3" href="#" id="logoutBtn"
                >Вихід</a
              >
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <main class="container my-5 flex-grow-1">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="card shadow border-0 overflow-hidden">
            <div class="card-header bg-primary text-white py-3 text-center">
              <h5 class="mb-0">Особисті дані користувача</h5>
            </div>
            <div class="card-body p-0">
              <table class="table table-striped mb-0">
                <tbody>
                  <tr>
                    <th class="ps-4 w-25 py-3">Ім'я</th>
                    <td class="py-3" id="profileName">Завантаження...</td>
                  </tr>
                  <tr>
                    <th class="ps-4 py-3">Email</th>
                    <td class="py-3 text-primary" id="profileEmail">Завантаження...</td>
                  </tr>
                  <tr>
                    <th class="ps-4 py-3">Стать</th>
                    <td class="py-3" id="profileSex">Завантаження...</td>
                  </tr>
                  <tr>
                    <th class="ps-4 py-3">Дата народження</th>
                    <td class="py-3" id="profileDob">Завантаження...</td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer
      class="bg-dark text-white text-center py-4 border-top border-secondary"
    >
      <div class="container">
        <p class="mb-0 small">&copy; 2026 ShortyURL Inc. Усі права захищено.</p>
      </div>
    </footer>

    <script>
      class ProfileModel {
        getCurrentUser() {
          const userStr = localStorage.getItem('currentUser');
          return userStr ? JSON.parse(userStr) : null;
        }

        logout() {
          localStorage.removeItem('currentUser');
        }
      }

      class ProfileView {
        constructor() {
          this.nameField = document.getElementById('profileName');
          this.emailField = document.getElementById('profileEmail');
          this.sexField = document.getElementById('profileSex');
          this.dobField = document.getElementById('profileDob');
          this.logoutBtn = document.getElementById('logoutBtn');
        }

        renderProfile(userData) {
          this.nameField.textContent = userData.name;
          this.emailField.textContent = userData.email;
          this.sexField.textContent = userData.sex;
          this.dobField.textContent = userData.dob;
        }

        bindLogout(handler) {
          this.logoutBtn.addEventListener('click', (e) => {
            e.preventDefault();
            handler();
          });
        }
      }

      class ProfileController {
        constructor(model, view) {
          this.model = model;
          this.view = view;

          this.init();
        }

        init() {
          const user = this.model.getCurrentUser();
          
          if (!user) {
            window.location.href = 'login.html';
            return; 
          }
          this.view.renderProfile(user)
          this.view.bindLogout(this.handleLogout.bind(this));
        }

        handleLogout() {
          this.model.logout();
          window.location.href = 'login.html';
        }
      }

      const app = new ProfileController(new ProfileModel(), new ProfileView());
    </script>
  </body>
</html>
